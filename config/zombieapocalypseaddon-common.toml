		maxKnockbackResistanceScaleMultiplier = 0.0
		#Extra flat knockback resistance bonus added at 100% difficulty.
		#Useful values are usually between 0.0 and 1.0.
		# Default: 0.0
		# Range: -1.0 ~ 1.0
